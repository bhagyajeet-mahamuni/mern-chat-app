#
## Goal - The goal of this file is to create workflows for code, build and deploy the mern-chat-app which is already dockerized.
#

name: mern-chat-app-CI-CD-workflow

on:
  push:
    branches:
      master


jobs:

  ## CI [ Continous integrations ]

  test-and-build:
    runs-on: ubuntu-latest
  

    steps:

      - name: checkout the code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root depenendencies
        run: npm install

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Build the application
        run: npm run build

##===========================================================
#

  Build-and-push: ## This will build the docker images and push them on Dockerhub
    runs-on: ubuntu-latest


    steps:

      - name: checkout the code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${secrets.DOCKERHUB_USERNAME}
          password: ${secrets.DOCKERHUB_TOKEN}

      - name: Generate the backend docker image
        run:  docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-chat-app-backend:latest ./backend

      - name: Generate the frontend docker image
        run: docker build -t ${{ secrets.DOCKERHUB_TOKEN }}/mern-chat-app-frontend:latest ./frontend

      - name: Push the backend docker image to DockerHUb
        run: docker push ${{ secrets.DOCKERHUB_USERNAMR }}/mern-chat-app-backend:latest

      - name: Push the frontend docker image to the DockerHUb
        run:  docker push ${{ secrets.DOCKERHUB_TOKEN }}/mern-chat-app-frontend:latest





